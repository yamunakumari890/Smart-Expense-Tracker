<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smaert Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>💰 Smart Expense Tracker</h1>
      <p>Manage your money, track your future.</p>

      <section class="summary-cards">

      <div class="summary-card">
        <h3>Total Income</h3>
        <p id="totalIncome">₹0</p>
      </div>

      <div class="summary-card">
        <h3>Total Income</h3>
        <p id="totalIncome">₹0</p>
      </div>

      <div class="summary-card">
        <h3>Total Expenses</h3>
        <p id="totalExpenses">₹0 </P>
      </div>

      <section class="transaction-section">
        <h2>Add New Transaction</h2>

        <form id="transactionForm">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Shopping Salary" required>
          </div>

          <div class="form-group">
            <label for="amount">Amount (₹) </label>
            <input type="text" id="amount" placeholder="Enter amount" min="1" step="0.01" required>
          </div>
        </form>
      </section>

  </section>

  </div>
  
</body>
<script src="script.js"></script>
</html>
