<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smaert Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>💰 Smart Expense Tracker</h1>
      <p>Manage your money, track your future.</p>

      <section class="summary-cards">

      <div class="summary-card">
        <h3>Total Income</h3>
        <p id="totalIncome">₹0</p>
      </div>

      <div class="summary-card">
        <h3>Total Income</h3>
        <p id="totalIncome">₹0</p>
      </div>

      <div class="summary-card">
        <h3>Total Expenses</h3>
        <p id="totalExpenses">₹0 </P>
      </div>

      <section class="transaction-section">
        <h2>Add New Transaction</h2>

        <form id="transactionForm">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Shopping Salary" required>
          </div>

          <div class="form-group">
            <label for="amount">Amount (₹) </label>
            <input type="text" id="amount" placeholder="Enter amount" min="1" step="0.01" required>
          </div>

          <div class="form-group">
            <label for="type">Tranction Type</label>
            <select id="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Salary">Salary</option>
              <option value="Food">Food</option>
              <option value="Shopping">Shopping</option>
              <option value="Travel">Travel</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button type="submit" class="add-btn"> + Add Transaction</button>

        </form>
      </section>

  </section>

  </div>
  
</body>
<script src="script.js"></script>
</html>
